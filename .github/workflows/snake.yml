name: Update GitHub statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - assets/github-statistics.svg
      - assets/github-streak.svg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update GitHub streak card
        run: |
          curl -s --max-time 20 "https://github-readme-streak-stats.herokuapp.com/?user=Jaclyn25&theme=radical" -o assets/github-streak.svg || true
          if grep -q "Total Contributions" assets/github-streak.svg; then
            echo "Streak card updated successfully"
          else
            git checkout assets/github-streak.svg
          fi

      - name: Generate GitHub statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/generate-contribution-streak.mjs

      - name: Commit updated GitHub statistics image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-statistics.svg assets/github-streak.svg
          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "Update GitHub statistics image"
            git push origin HEAD:main
          fi
