name: Update GitHub statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - assets/github-statistics.svg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/generate-contribution-streak.mjs

      - name: Commit updated GitHub statistics image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-statistics.svg
          if git diff --cached --quiet; then
            echo "No statistics changes."
          else
            git commit -m "Update GitHub statistics image"
            git push origin HEAD:main
          fi
